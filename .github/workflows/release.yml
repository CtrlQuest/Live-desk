name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get tag version
        id: tag
        run: echo "version=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: Coco LiveDesk ${{ steps.tag.outputs.version }}
          body: |
            ## Coco LiveDesk ${{ steps.tag.outputs.version }}

            ### Install through HACS
            See the [README](https://github.com/${{ github.repository }}#installation-for-testing) for setup instructions.

            ### Manual installation
            1. Download `livedesk.js` from the assets below.
            2. Copy it to `/config/www/livedesk.js`.
            3. Add `/local/livedesk.js` as a JavaScript module resource.
            4. Hard reload the browser with `Ctrl+Shift+R`.
          files: livedesk.js
          draft: false
          prerelease: false
